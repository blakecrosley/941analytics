[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytics-941"
version = "0.3.8"
description = "Privacy-first analytics for 941 Apps projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Blake Crosley", email = "blake@941apps.com" }
]
dependencies = [
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "webauthn>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    # Linters are pinned exactly, not floored. An open range means every new ruff
    # release can add rules and turn CI red with no code change -- which is what
    # happened: 0.16.1 introduced UP042 and broke the build on untouched files.
    "ruff==0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_941"]

# Ruff configuration (cicd-3)
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    # UP042 wants `class X(str, Enum)` rewritten as `class X(StrEnum)`. Deferred, not
    # declined: the two differ in __str__ (`"X.FOO"` vs `"foo"`), so the swap is a
    # behaviour change on ReferrerType, DeviceType, and BotCategory -- all of which are
    # serialized. Worth doing deliberately with the call sites checked, not because a
    # linter upgrade forced it.
    "UP042",  # str+Enum -> StrEnum (see note above)
]

[tool.ruff.lint.isort]
known-first-party = ["analytics_941"]

[tool.ruff.format]
# "preserve", not "double". With quote-style = "double", ruff 0.16.1 rewrites
#     f'<tr><td>{p["url"]}</td></tr>'
# into
#     f"<tr><td>{p["url"]}</td></tr>"
# which reuses the outer quote inside the f-string. That is PEP 701 syntax and is
# only valid on Python 3.12+, while this project targets 3.11 -- so the formatter
# emits code the target interpreter cannot parse. It does this despite
# target-version = "py311" above. Verified on routes.py: 0 syntax errors before
# formatting, 9 after. Keep "preserve" until ruff honours target-version here.
quote-style = "preserve"
indent-style = "space"

# Mypy configuration (cicd-2)
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten later
ignore_missing_imports = true
exclude = ["tests/"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"

# Coverage configuration
[tool.coverage.run]
source = ["src/analytics_941"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
